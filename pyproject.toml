[project]
name = "video-segment-analysis"
version = "0.1.0"
description = "Split long conference recordings into per-talk segments, transcribe them, and describe slide changes."
readme = "README.md"
authors = [
    { name = "Red5d", email = "daniel.colson99@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "openai>=1.40",
    "opencv-python-headless>=4.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "qwen-asr>=0.0.1",
    # Direct dep so tool.uv.sources (below) can pin the ROCm build — uv
    # applies source pins only to packages declared in this manifest, and
    # torch otherwise arrives transitively via qwen-asr as the CUDA build.
    "torch>=2.14.1",
    "rich>=13.0",
    "tenacity>=8.2",
    "typer>=0.12",
    "yt-dlp>=2025.1",
    # ROCm torch pulled in transitively by qwen-asr must come from the ROCm
    # index (this machine's GPU is gfx1201 / ROCm 7.2) — see tool.uv.sources.
    # ROCm torch requires both triton variants from the same index.
    "pytorch-triton-rocm>=3.5.1 ; sys_platform == 'linux'",
    "triton-rocm>=3.6.0 ; sys_platform == 'linux'",
]

[project.scripts]
vsa = "video_segment_analysis.cli:app"

[tool.pytest.ini_options]
markers = [
    "network: tests that require network access (excluded by default)",
]
addopts = "-m 'not network'"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
# torch enters the graph transitively via qwen-asr; source pins apply to
# transitive deps too. ROCm wheels exist for Linux only — on any other
# platform fall back to PyPI (CPU/CUDA builds per PyPI's own table).
torch = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]
pytorch-triton-rocm = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]
triton-rocm = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "responses>=0.26.3",
]
